[project]
name = "mcdetect"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lightning>=2.6.4",
    "numpy>=2.4.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "roboflow>=1.3.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.46",
    "wandb>=0.26.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "ruff>=0.15.8",
]

[tool.uv]
exclude-newer = "7 days"
# Ultralytics pulls opencv-python (needs libxcb on Linux); headless is enough for cv2.
exclude-dependencies = ["opencv-python"]
override-dependencies = ["opencv-python-headless>=4.13.0.92"]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
include = ["."]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "N"]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
